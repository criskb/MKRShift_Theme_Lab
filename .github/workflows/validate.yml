name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate frontend JavaScript syntax
        run: |
          node --check js/theme-lab.js
          node --check js/theme-lab-canvas.js
          node --check js/providers/extension-settings-provider.js
          node --check js/providers/extension-style-provider.js
          node --check js/studio/template-studio.js

      - name: Validate backend Python syntax
        run: |
          python -m py_compile __init__.py
          python -m py_compile backend/__init__.py
          python -m py_compile backend/extension_style_scan.py
